<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade with Custom Backgrounds & Game Cover Art</title>
    <!-- Ruffle Flash Emulator CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
      :root {
        --card-bg: rgba(15, 23, 42, 0.8);
        --accent-color: #6366f1;
        --accent-hover: #4f46e5;
        --danger-color: #ef4444;
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        color: var(--text-color);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
        background-color: #0f172a;
      }

      /* Animated Dynamic Canvas Background */
      #bg-canvas, #custom-bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        object-fit: cover;
        pointer-events: none;
      }

      #custom-bg-video {
        display: none;
      }

      .app-container {
        width: 100%;
        max-width: 1000px;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 16px;
      }

      .title {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(to right, #ffffff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* Custom Controls */
      .btn {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .btn-primary {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      select.btn {
        background-color: #1e293b;
        color: var(--text-color);
        outline: none;
      }

      input[type="file"] {
        display: none;
      }

      /* Game Player */
      #player-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background-color: #000;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .placeholder {
        text-align: center;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .placeholder svg {
        width: 48px;
        height: 48px;
        stroke: var(--text-muted);
        opacity: 0.6;
      }

      /* Grid Library with Covers */
      .library-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .library-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .library-title {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      .game-card {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, border-color 0.2s ease;
        position: relative;
      }

      .game-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent-color);
      }

      .cover-container {
        width: 100%;
        height: 120px;
        background-color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      .cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cover-placeholder {
        color: var(--text-muted);
        font-size: 0.75rem;
      }

      .game-card-body {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .game-card-title {
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn-sm {
        padding: 4px 8px;
        font-size: 0.75rem;
        border-radius: 4px;
      }

      /* Modal Dialog */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal {
        background: #1e293b;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        width: 90%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .modal-title {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .input-group label {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .input-group input[type="text"] {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
      }

      #player-wrapper:fullscreen {
        border-radius: 0;
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- Background Elements -->
    <canvas id="bg-canvas"></canvas>
    <video id="custom-bg-video" autoplay loop muted playsinline></video>

    <div class="app-container">
      <div class="header">
        <h1 class="title">Flash Arcade Player</h1>

        <div class="controls">
          <!-- Animated Background Selection -->
          <select id="bg-select" class="btn">
            <option value="particles">Animated Particles</option>
            <option value="waves">Gradient Waves</option>
            <option value="custom">Custom Video / Animated GIF</option>
          </select>
          <input type="file" id="custom-bg-input" accept="video/mp4, video/webm, image/gif" />

          <!-- SWF File Selector -->
          <button class="btn btn-primary" onclick="document.getElementById('add-game-modal').style.display='flex'">
            + Add New Game
          </button>

          <!-- Fullscreen Switch -->
          <button id="fullscreen-btn" class="btn" disabled>Full Screen</button>
        </div>
      </div>

      <!-- Main Game Viewport -->
      <div id="player-wrapper">
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <p>Select a SWF game from your library below to play</p>
        </div>
      </div>

      <!-- Games Storage Section -->
      <div class="library-section">
        <div class="library-header">
          <h2 class="library-title">Saved SWF Games Storage</h2>
        </div>
        <div class="game-grid" id="game-grid">
          <p style="color: var(--text-muted); font-size: 0.875rem;">No games added yet. Click "+ Add New Game" to store SWF files with custom covers.</p>
        </div>
      </div>
    </div>

    <!-- Add Game Modal -->
    <div class="modal-overlay" id="add-game-modal">
      <div class="modal">
        <h3 class="modal-title">Add Game to Storage</h3>
        
        <div class="input-group">
          <label>Game Title</label>
          <input type="text" id="modal-title-input" placeholder="e.g. Alien Hominid" />
        </div>

        <div class="input-group">
          <label>SWF Game File</label>
          <button class="btn" onclick="document.getElementById('modal-swf-file').click()">Choose .SWF File</button>
          <input type="file" id="modal-swf-file" accept=".swf" />
          <span id="swf-file-name" style="font-size:0.75rem; color: var(--text-muted);">No file chosen</span>
        </div>

        <div class="input-group">
          <label>Custom Cover Image (Optional)</label>
          <button class="btn" onclick="document.getElementById('modal-cover-file').click()">Choose Image File</button>
          <input type="file" id="modal-cover-file" accept="image/*" />
          <span id="cover-file-name" style="font-size:0.75rem; color: var(--text-muted);">No cover chosen</span>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveGame()">Save Game</button>
        </div>
      </div>
    </div>

    <script>
      // Runtime Storage (In-Memory)
      let gameStorage = [];

      // Element References
      const wrapper = document.getElementById('player-wrapper');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const gameGrid = document.getElementById('game-grid');
      const bgSelect = document.getElementById('bg-select');
      const customBgInput = document.getElementById('custom-bg-input');
      const bgCanvas = document.getElementById('bg-canvas');
      const customBgVideo = document.getElementById('custom-bg-video');

      // Modal File inputs tracking
      let tempSwfData = null;
      let tempCoverData = null;

      document.getElementById('modal-swf-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById('swf-file-name').innerText = file.name;
          const reader = new FileReader();
          reader.onload = (evt) => { tempSwfData = evt.target.result; };
          reader.readAsArrayBuffer(file);
        }
      });

      document.getElementById('modal-cover-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById('cover-file-name').innerText = file.name;
          const reader = new FileReader();
          reader.onload = (evt) => { tempCoverData = evt.target.result; };
          reader.readAsDataURL(file);
        }
      });

      function closeModal() {
        document.getElementById('add-game-modal').style.display = 'none';
        document.getElementById('modal-title-input').value = '';
        document.getElementById('swf-file-name').innerText = 'No file chosen';
        document.getElementById('cover-file-name').innerText = 'No cover chosen';
        tempSwfData = null;
        tempCoverData = null;
      }

      function saveGame() {
        const title = document.getElementById('modal-title-input').value.trim();
        if (!title || !tempSwfData) {
          alert('Please enter a title and select a valid .SWF file.');
          return;
        }

        const newGame = {
          id: Date.now(),
          title: title,
          swfData: tempSwfData,
          coverData: tempCoverData
        };

        gameStorage.push(newGame);
        renderStorage();
        closeModal();
      }

      function renderStorage() {
        if (gameStorage.length === 0) {
          gameGrid.innerHTML = `<p style="color: var(--text-muted); font-size: 0.875rem;">No games added yet. Click "+ Add New Game" to store SWF files with custom covers.</p>`;
          return;
        }

        gameGrid.innerHTML = '';
        gameStorage.forEach((game) => {
          const card = document.createElement('div');
          card.className = 'game-card';
          
          const coverHTML = game.coverData 
            ? `<img src="${game.coverData}" class="cover-img" alt="Cover" />` 
            : `<span class="cover-placeholder">No Cover Image</span>`;

          card.innerHTML = `
            <div class="cover-container">
              ${coverHTML}
            </div>
            <div class="game-card-body">
              <div class="game-card-title" title="${game.title}">${game.title}</div>
              <div class="card-actions">
                <button class="btn btn-primary btn-sm" onclick="playGame(${game.id})">Play</button>
                <button class="btn btn-sm" style="color:var(--danger-color)" onclick="deleteGame(${game.id})">Delete</button>
              </div>
            </div>
          `;
          gameGrid.appendChild(card);
        });
      }

      function playGame(id) {
        const game = gameStorage.find(g => g.id === id);
        if (!game) return;

        wrapper.innerHTML = '';
        const ruffle = window.RufflePlayer ? window.RufflePlayer.newest() : null;
        if (!ruffle) {
          alert('Ruffle player failed to initialize.');
          return;
        }

        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';
        wrapper.appendChild(player);

        player.load({ data: new Uint8Array(game.swfData) });
        fullscreenBtn.disabled = false;
      }

      function deleteGame(id) {
        gameStorage = gameStorage.filter(g => g.id !== id);
        renderStorage();
      }

      /* Fullscreen Controller */
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
        } else {
          document.exitFullscreen?.() || document.webkitExitFullscreen?.();
        }
      });

      /* Canvas Background Animation System */
      const ctx = bgCanvas.getContext('2d');
      let currentAnimation = 'particles';
      let animationFrameId = null;

      function resizeCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Particle Engine Setup
      const particles = Array.from({ length: 50 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 2 + 1,
        dx: (Math.random() - 0.5) * 0.8,
        dy: (Math.random() - 0.5) * 0.8
      }));

      let waveOffset = 0;

      function renderBackground() {
        ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

        if (currentAnimation === 'particles') {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
          ctx.fillStyle = 'rgba(99, 102, 241, 0.5)';

          particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            p.x += p.dx;
            p.y += p.dy;

            if (p.x < 0 || p.x > bgCanvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > bgCanvas.height) p.dy *= -1;
          });
        } else if (currentAnimation === 'waves') {
          waveOffset += 0.01;
          const gradient = ctx.createLinearGradient(0, 0, bgCanvas.width, bgCanvas.height);
          gradient.addColorStop(0, '#0f172a');
          gradient.addColorStop(0.5, '#1e1b4b');
          gradient.addColorStop(1, '#0f172a');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

          ctx.fillStyle = 'rgba(99, 102, 241, 0.15)';
          ctx.beginPath();
          ctx.moveTo(0, bgCanvas.height);
          for (let x = 0; x <= bgCanvas.width; x += 10) {
            const y = Math.sin(x * 0.003 + waveOffset) * 40 + bgCanvas.height * 0.6;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(bgCanvas.width, bgCanvas.height);
          ctx.closePath();
          ctx.fill();
        }

        if (currentAnimation !== 'custom') {
          animationFrameId = requestAnimationFrame(renderBackground);
        }
      }

      bgSelect.addEventListener('change', (e) => {
        const mode = e.target.value;
        if (mode === 'custom') {
          customBgInput.click();
        } else {
          currentAnimation = mode;
          customBgVideo.style.display = 'none';
          bgCanvas.style.display = 'block';
          cancelAnimationFrame(animationFrameId);
          renderBackground();
        }
      });

      customBgInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          customBgVideo.src = url;
          customBgVideo.style.display = 'block';
          bgCanvas.style.display = 'none';
          currentAnimation = 'custom';
          cancelAnimationFrame(animationFrameId);
        }
      });

      // Start default animation loop
      renderBackground();
    </script>
  </body>
</html>

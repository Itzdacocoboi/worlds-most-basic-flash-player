<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Arcade & Library</title>
    <!-- Ruffle Flash Emulator CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
      :root {
        --card-bg: rgba(15, 23, 42, 0.85);
        --accent-color: #6366f1;
        --accent-hover: #4f46e5;
        --danger-color: #ef4444;
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        color: var(--text-color);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
        background-color: #000000;
        transition: background-color 0.3s ease;
      }

      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      .app-container {
        width: 100%;
        max-width: 1000px;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 16px;
      }

      .title {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(to right, #ffffff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .btn {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .btn-primary {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      /* Preset Colors Styling */
      .preset-container {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.4);
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .preset-container label {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .color-presets {
        display: flex;
        gap: 6px;
      }

      .color-swatch {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .color-swatch:hover {
        transform: scale(1.15);
      }

      .color-swatch.active {
        border-color: #ffffff;
        transform: scale(1.1);
      }

      input[type="file"] {
        display: none;
      }

      #player-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background-color: #000;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .placeholder {
        text-align: center;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .library-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .library-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      .game-card {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .game-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent-color);
      }

      .cover-container {
        width: 100%;
        height: 120px;
        background-color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cover-placeholder {
        color: var(--text-muted);
        font-size: 0.75rem;
      }

      .game-card-body {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .game-card-title {
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-actions {
        display: flex;
        justify-content: space-between;
      }

      .btn-sm {
        padding: 4px 8px;
        font-size: 0.75rem;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .modal {
        background: #1e293b;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        width: 90%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .input-group label {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .input-group input[type="text"] {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
      }

      #player-wrapper:fullscreen {
        border-radius: 0;
        border: none;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
      <div class="header">
        <h1 class="title">Offline Arcade & Library</h1>

        <div class="controls">
          <!-- Preset Color Picker -->
          <div class="preset-container">
            <label>Particles:</label>
            <div class="color-presets" id="color-presets"></div>
          </div>

          <button class="btn btn-primary" onclick="document.getElementById('add-game-modal').style.display='flex'">
            + Add Game
          </button>

          <button id="fullscreen-btn" class="btn" disabled>Full Screen</button>
        </div>
      </div>

      <div id="player-wrapper">
        <div class="placeholder" id="placeholder">
          <p>Select a game below to start playing</p>
        </div>
      </div>

      <div class="library-section">
        <div class="library-header">
          <h2>Stored Games</h2>
        </div>
        <div class="game-grid" id="game-grid">
          <p style="color: var(--text-muted); font-size: 0.875rem;">Loading saved games...</p>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="add-game-modal">
      <div class="modal">
        <h3>Add Game</h3>
        <div class="input-group">
          <label>Game Title</label>
          <input type="text" id="modal-title-input" placeholder="Game Name" />
        </div>
        <div class="input-group">
          <label>SWF File</label>
          <button class="btn" onclick="document.getElementById('modal-swf-file').click()">Choose .SWF File</button>
          <input type="file" id="modal-swf-file" accept=".swf" />
          <span id="swf-file-name" style="font-size:0.75rem; color: var(--text-muted);">No file chosen</span>
        </div>
        <div class="input-group">
          <label>Cover Image (Optional)</label>
          <button class="btn" onclick="document.getElementById('modal-cover-file').click()">Choose Cover</button>
          <input type="file" id="modal-cover-file" accept="image/*" />
          <span id="cover-file-name" style="font-size:0.75rem; color: var(--text-muted);">No cover chosen</span>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveGame()">Add Game</button>
        </div>
      </div>
    </div>

    <script>
      let gameStorage = [];
      const wrapper = document.getElementById('player-wrapper');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const gameGrid = document.getElementById('game-grid');

      let tempSwfBase64 = null;
      let tempCoverBase64 = null;

      // 8 Preset Particle Colors
      const presetColors = [
        { name: 'Indigo', hex: '#6366f1' },
        { name: 'Cyan', hex: '#06b6d4' },
        { name: 'Emerald', hex: '#10b981' },
        { name: 'Rose', hex: '#f43f5e' },
        { name: 'Amber', hex: '#f59e0b' },
        { name: 'Purple', hex: '#a855f7' },
        { name: 'White', hex: '#ffffff' },
        { name: 'Neon Green', hex: '#39ff14' }
      ];

      // Default particle color is Indigo (#6366f1)
      let activeParticleColor = localStorage.getItem('arcade_particle_color') || '#6366f1';

      // Setup Preset Buttons
      const presetsContainer = document.getElementById('color-presets');
      presetColors.forEach(preset => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = preset.hex;
        swatch.title = preset.name;
        
        if (preset.hex === activeParticleColor) {
          swatch.classList.add('active');
        }

        swatch.addEventListener('click', () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          activeParticleColor = preset.hex;
          localStorage.setItem('arcade_particle_color', preset.hex);
        });

        presetsContainer.appendChild(swatch);
      });

      // Initialize IndexedDB
      let db;
      const dbRequest = indexedDB.open("ArcadeLibraryDB", 1);

      dbRequest.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("games")) {
          db.createObjectStore("games", { keyPath: "id" });
        }
      };

      dbRequest.onsuccess = (e) => {
        db = e.target.result;
        loadGamesFromDB();
      };

      dbRequest.onerror = () => {
        console.error("IndexedDB error, unable to open storage.");
      };

      function loadGamesFromDB() {
        if (!db) return;
        const transaction = db.transaction(["games"], "readonly");
        const store = transaction.objectStore("games");
        const getAllRequest = store.getAll();

        getAllRequest.onsuccess = () => {
          gameStorage = getAllRequest.result || [];
          renderStorage();
        };
      }

      function saveGameToDB(gameObj) {
        if (!db) return;
        const transaction = db.transaction(["games"], "readwrite");
        const store = transaction.objectStore("games");
        store.put(gameObj);
      }

      function deleteGameFromDB(id) {
        if (!db) return;
        const transaction = db.transaction(["games"], "readwrite");
        const store = transaction.objectStore("games");
        store.delete(id);
      }

      document.getElementById('modal-swf-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById('swf-file-name').innerText = file.name;
          const reader = new FileReader();
          reader.onload = (evt) => { tempSwfBase64 = evt.target.result; };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('modal-cover-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById('cover-file-name').innerText = file.name;
          const reader = new FileReader();
          reader.onload = (evt) => { tempCoverBase64 = evt.target.result; };
          reader.readAsDataURL(file);
        }
      });

      function closeModal() {
        document.getElementById('add-game-modal').style.display = 'none';
        document.getElementById('modal-title-input').value = '';
        document.getElementById('swf-file-name').innerText = 'No file chosen';
        document.getElementById('cover-file-name').innerText = 'No cover chosen';
        tempSwfBase64 = null;
        tempCoverBase64 = null;
      }

      function saveGame() {
        const title = document.getElementById('modal-title-input').value.trim();
        if (!title || !tempSwfBase64) {
          alert('Please enter a title and select a .SWF file.');
          return;
        }

        const newGame = {
          id: Date.now(),
          title: title,
          swfData: tempSwfBase64,
          coverData: tempCoverBase64
        };

        gameStorage.push(newGame);
        saveGameToDB(newGame);
        renderStorage();
        closeModal();
      }

      function renderStorage() {
        if (gameStorage.length === 0) {
          gameGrid.innerHTML = `<p style="color: var(--text-muted); font-size: 0.875rem;">No games added yet. Add a game to automatically save it in your browser.</p>`;
          return;
        }

        gameGrid.innerHTML = '';
        gameStorage.forEach((game) => {
          const card = document.createElement('div');
          card.className = 'game-card';
          const coverHTML = game.coverData 
            ? `<img src="${game.coverData}" class="cover-img" alt="Cover" />` 
            : `<span class="cover-placeholder">No Cover</span>`;

          card.innerHTML = `
            <div class="cover-container">${coverHTML}</div>
            <div class="game-card-body">
              <div class="game-card-title">${game.title}</div>
              <div class="card-actions">
                <button class="btn btn-primary btn-sm" onclick="playGame(${game.id})">Play</button>
                <button class="btn btn-sm" style="color:var(--danger-color)" onclick="deleteGame(${game.id})">Delete</button>
              </div>
            </div>
          `;
          gameGrid.appendChild(card);
        });
      }

      function playGame(id) {
        const game = gameStorage.find(g => g.id === id);
        if (!game) return;

        wrapper.innerHTML = '';
        const ruffle = window.RufflePlayer ? window.RufflePlayer.newest() : null;
        if (!ruffle) return alert('Ruffle failed to load.');

        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';
        wrapper.appendChild(player);

        const base64Str = game.swfData.split(',')[1];
        const binaryStr = atob(base64Str);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }

        player.load({ data: bytes });
        fullscreenBtn.disabled = false;
      }

      function deleteGame(id) {
        gameStorage = gameStorage.filter(g => g.id !== id);
        deleteGameFromDB(id);
        renderStorage();
      }

      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
        } else {
          document.exitFullscreen?.() || document.webkitExitFullscreen?.();
        }
      });

      // Canvas Particle Background Engine
      const bgCanvas = document.getElementById('bg-canvas');
      const ctx = bgCanvas.getContext('2d');

      function resizeCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Create 50 floating particles
      const particles = Array.from({ length: 50 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 2.5 + 1,
        dx: (Math.random() - 0.5) * 0.8,
        dy: (Math.random() - 0.5) * 0.8,
        alpha: Math.random() * 0.5 + 0.3
      }));

      function renderBackground() {
        // Clear background to pure black
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

        // Draw active preset color particles
        ctx.fillStyle = activeParticleColor;

        particles.forEach(p => {
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();

          p.x += p.dx;
          p.y += p.dy;

          if (p.x < 0 || p.x > bgCanvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > bgCanvas.height) p.dy *= -1;
        });

        ctx.globalAlpha = 1.0;
        requestAnimationFrame(renderBackground);
      }

      // Start particle animation immediately on launch
      renderBackground();
    </script>
  </body>
</html>
